name: MSBuild

on:
  push:
    branches: [ "cherrytree" ]
  pull_request:
    branches: [ "cherrytree" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions: write-all

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1

    - name: Get Pkhex  
      run: git clone -q --depth=5 --branch=master https://github.com/kwsch/PKHeX.git ${{ github.workspace }}/PKHeX

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{ github.workspace }}\PKHeX\PKHeX.sln
      
    - name: Build Pkhex
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{ github.workspace }}\PKHeX\PKHeX.sln

    - name: Show Github infos
      run: | 
        echo 'Workspace path ${{ github.workspace }} - runner.temp ${{ runner.temp }}'  
                          
    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Get pkhex.core version
      run: |
          VERSIONNAME=$(xmllint --xpath '//Version/text()')
          echo "VERSIONNAME=$VERSIONNAME" >> $GITHUB_ENV
          echo VERSIONNAME is: $VERSIONNAME      
     
    - name: copy latest dll to nuget pkhex.core dir
      run: XCOPY ${{ github.workspace }}\PKHeX\PKHeX.Core\bin\Release\net8.0\PKHeX.Core.dll C:\Users\runneradmin\.nuget\packages\pkhex.core\24.7.27\lib\net8.0 /Y 
      
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /t:Publish
            
    - name: Create Release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ github.token }} 
      with:
        draft: false
        prerelease: false
        release_name: ${{ steps.version.outputs.version }}
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
            
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}\AutoLegalityMod\bin\Release\net8.0-windows\AutoModPlugins.dll
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        
